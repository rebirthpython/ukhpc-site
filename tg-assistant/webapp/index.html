<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ассистент</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #fff9fc);
  --text: var(--tg-theme-text-color, #2b2130);
  --hint: var(--tg-theme-hint-color, #8d8193);
  --link: var(--tg-theme-link-color, #6b46e5);
  --surface: var(--tg-theme-secondary-bg-color, #f5edf3);
  --header-bg: var(--tg-theme-header-bg-color, var(--bg));
  --line: color-mix(in srgb, var(--text) 10%, transparent);
  --a1: #cf3770;
  --a2: #6b46e5;
  --grad: linear-gradient(135deg, var(--a1), var(--a2));
  --danger: #d93a3a;
  --radius: 20px;
  --safe-top: max(var(--tg-content-safe-area-inset-top, 0px), env(safe-area-inset-top, 0px));
  --safe-bottom: max(var(--tg-safe-area-inset-bottom, 0px), env(safe-area-inset-bottom, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--tg-theme-bg-color, #17131b);
    --text: var(--tg-theme-text-color, #f1eaf4);
    --hint: var(--tg-theme-hint-color, #9e93a6);
    --link: var(--tg-theme-link-color, #a98bff);
    --surface: var(--tg-theme-secondary-bg-color, #241d2a);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

.app {
  height: var(--tg-viewport-height, 100dvh);
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
}

/* ---------- header ---------- */
.top {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: var(--header-bg);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--grad); color: #fff;
  display: grid; place-items: center;
  font-weight: 700; font-size: 18px; flex-shrink: 0;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--a2) 35%, transparent);
}
.who { flex: 1; min-width: 0; }
.who b { display: block; font-size: 16px; line-height: 1.2; }
.who small { color: var(--hint); font-size: 13px; }
.who small.busy { color: var(--a2); }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 0;
  background: transparent; display: grid; place-items: center;
  color: var(--hint); transition: background .15s, color .15s;
}
.icon-btn:hover, .icon-btn:focus-visible { background: var(--surface); color: var(--text); outline: none; }
.icon-btn svg { width: 22px; height: 22px; }

/* ---------- messages ---------- */
.feed {
  flex: 1; overflow-y: auto; overscroll-behavior: contain;
  padding: 16px 16px 8px;
  display: flex; flex-direction: column; gap: 10px;
}
.msg { max-width: min(86%, 640px); display: flex; flex-direction: column; gap: 4px; animation: pop .18s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.ai { align-self: flex-start; }
.bubble {
  padding: 10px 14px; border-radius: var(--radius);
  word-wrap: break-word; overflow-wrap: anywhere;
}
.user .bubble { background: var(--grad); color: #fff; border-bottom-right-radius: 6px; white-space: pre-wrap; }
.ai .bubble { background: var(--surface); border-bottom-left-radius: 6px; }
.bubble img.att { display: block; max-width: 220px; max-height: 260px; border-radius: 14px; margin-bottom: 6px; }
.photo-tag { font-size: 13px; opacity: .85; }
.ai .bubble > :first-child { margin-top: 0; }
.ai .bubble > :last-child { margin-bottom: 0; }
.ai .bubble p, .ai .bubble ul, .ai .bubble ol, .ai .bubble pre, .ai .bubble blockquote { margin: 0 0 .6em; }
.ai .bubble ul, .ai .bubble ol { padding-left: 1.3em; }
.ai .bubble li + li { margin-top: .2em; }
.ai .bubble h1, .ai .bubble h2, .ai .bubble h3, .ai .bubble h4 { font-size: 1.05em; margin: .8em 0 .4em; }
.ai .bubble a { color: var(--link); }
.ai .bubble code { font: .9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: color-mix(in srgb, var(--text) 8%, transparent); padding: .1em .35em; border-radius: 6px; }
.ai .bubble pre { position: relative; background: color-mix(in srgb, var(--text) 7%, transparent); border-radius: 12px; padding: 10px 12px; overflow-x: auto; }
.ai .bubble pre code { background: none; padding: 0; font-size: .85em; }
.ai .bubble blockquote { border-left: 3px solid var(--a2); padding-left: 10px; color: var(--hint); }
.ai .bubble table { border-collapse: collapse; display: block; overflow-x: auto; margin: 0 0 .6em; }
.ai .bubble th, .ai .bubble td { border: 1px solid var(--line); padding: 4px 8px; }
.ai .bubble hr { border: 0; border-top: 1px solid var(--line); }
.copy-code {
  position: absolute; top: 6px; right: 6px; border: 0; border-radius: 8px;
  font-size: 12px; padding: 2px 8px; background: var(--bg); color: var(--hint); opacity: .9;
}
.tools { display: flex; gap: 2px; padding-left: 4px; }
.tools button { border: 0; background: none; color: var(--hint); font-size: 13px; padding: 2px 6px; border-radius: 8px; }
.tools button:hover { background: var(--surface); }
.status-pill {
  align-self: flex-start; font-size: 13px; color: var(--hint);
  background: var(--surface); border-radius: 999px; padding: 4px 12px;
}
.error-pill { align-self: center; font-size: 14px; color: var(--danger); text-align: center; padding: 4px 12px; }
.dots { display: inline-flex; gap: 4px; padding: 4px 2px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--hint); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: none; } }
.cursor::after { content: "▍"; color: var(--a2); animation: caret 1s steps(2) infinite; margin-left: 1px; }
@keyframes caret { 50% { opacity: 0; } }

/* ---------- empty state ---------- */
.hello { margin: auto 0; text-align: center; padding: 20px 4px; }
.hello .avatar { width: 72px; height: 72px; font-size: 32px; margin: 0 auto 14px; }
.hello h1 { font-size: 22px; margin: 0 0 6px; }
.hello p { color: var(--hint); margin: 0 auto 18px; max-width: 34ch; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 14px; font-size: 14px; text-align: left; transition: transform .12s, border-color .12s;
}
.chip:hover { border-color: var(--a2); }
.chip:active { transform: scale(.97); }

/* ---------- composer ---------- */
.composer {
  flex-shrink: 0; padding: 8px 12px calc(10px + var(--safe-bottom));
  border-top: 1px solid var(--line); background: var(--bg);
}
.preview { position: relative; display: inline-block; margin: 0 0 8px 4px; }
.preview img { height: 64px; border-radius: 12px; display: block; }
.preview button {
  position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%;
  border: 0; background: var(--text); color: var(--bg); font-size: 14px; line-height: 22px; padding: 0;
}
.row { display: flex; align-items: flex-end; gap: 8px; }
.field {
  flex: 1; display: flex; align-items: flex-end; background: var(--surface);
  border-radius: 22px; padding: 4px 6px 4px 4px; border: 1px solid transparent; transition: border-color .15s;
}
.field:focus-within { border-color: color-mix(in srgb, var(--a2) 55%, transparent); }
textarea {
  flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
  font: inherit; padding: 7px 6px; max-height: 140px; min-height: 36px; line-height: 1.4;
}
textarea::placeholder { color: var(--hint); }
.send {
  width: 44px; height: 44px; border-radius: 50%; border: 0; flex-shrink: 0;
  background: var(--grad); color: #fff; display: grid; place-items: center;
  transition: transform .12s, opacity .15s;
}
.send:disabled { opacity: .4; cursor: default; }
.send:not(:disabled):active { transform: scale(.92); }
.send svg { width: 22px; height: 22px; }
.notice { text-align: center; color: var(--hint); padding: 40px 20px; margin: auto; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="avatar" id="avatar">✨</div>
    <div class="who">
      <b id="title">Ассистент</b>
      <small id="sub">на связи</small>
    </div>
    <button class="icon-btn" id="btnUsage" title="Расходы" aria-label="Расходы">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    </button>
    <button class="icon-btn" id="btnNew" title="Новый диалог" aria-label="Новый диалог">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
  </header>

  <main class="feed" id="feed" aria-live="polite"></main>

  <footer class="composer">
    <div class="preview" id="preview" hidden>
      <img id="previewImg" alt="Прикреплённое фото">
      <button id="previewDel" aria-label="Убрать фото">×</button>
    </div>
    <div class="row">
      <div class="field">
        <button class="icon-btn" id="btnAttach" title="Прикрепить фото" aria-label="Прикрепить фото">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.6-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.9-2.9l8.5-8.5"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Сообщение…" enterkeyhint="send"></textarea>
      </div>
      <button class="send" id="btnSend" aria-label="Отправить" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </footer>
</div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = (id) => document.getElementById(id);
  const feed = $("feed"), input = $("input"), btnSend = $("btnSend");
  const state = { busy: false, image: null, name: "", assistant: "Ассистент", budget: null, started: false };

  const IDEAS = [
    "🍝 Что приготовить на ужин из того, что есть дома?",
    "🎁 Идеи подарка подруге на день рождения",
    "💌 Помоги красиво написать поздравление",
    "🌍 Переведи текст на английский",
    "💪 Составь план тренировок на неделю",
    "📸 Подбери образ — сейчас пришлю фото",
  ];

  // ---------- Telegram ----------
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (_) {}
    try {
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--tg-theme-bg-color").trim();
      if (bg) { tg.setHeaderColor && tg.setHeaderColor(bg); tg.setBackgroundColor && tg.setBackgroundColor(bg); }
    } catch (_) {}
    if (tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme;
    tg.onEvent && tg.onEvent("themeChanged", () => { document.documentElement.dataset.theme = tg.colorScheme; });
  }
  const haptic = (kind) => { try {
    if (!tg || !tg.HapticFeedback) return;
    if (kind === "tap") tg.HapticFeedback.impactOccurred("light");
    else tg.HapticFeedback.notificationOccurred(kind);
  } catch (_) {} };
  const authHeaders = () => (tg && tg.initData ? { Authorization: "tma " + tg.initData } : {});

  // ---------- rendering ----------
  const hasMarked = typeof marked !== "undefined" && typeof DOMPurify !== "undefined";
  if (hasMarked) marked.setOptions({ gfm: true, breaks: true });
  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function renderMarkdown(el, text) {
    el.innerHTML = hasMarked
      ? DOMPurify.sanitize(marked.parse(text), { ADD_ATTR: ["target"] })
      : escapeHtml(text).replace(/\n/g, "<br>");
    el.querySelectorAll("pre").forEach((pre) => {
      const b = document.createElement("button");
      b.className = "copy-code"; b.textContent = "копировать";
      const code = pre.querySelector("code");
      b.onclick = () => copy((code ? code.innerText : pre.firstChild.textContent || "").trim(), b);
      pre.appendChild(b);
    });
  }
  async function copy(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch (_) {
      const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t);
      t.select(); document.execCommand("copy"); t.remove();
    }
    haptic("success");
    if (btn) { const old = btn.textContent; btn.textContent = "скопировано ✓"; setTimeout(() => (btn.textContent = old), 1400); }
  }
  feed.addEventListener("click", (e) => {
    const a = e.target.closest("a[href]");
    if (!a) return;
    e.preventDefault();
    if (tg && tg.openLink) tg.openLink(a.href); else window.open(a.href, "_blank", "noopener");
  });

  const nearBottom = () => feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
  const scrollDown = (force) => { if (force || nearBottom()) feed.scrollTop = feed.scrollHeight; };

  function addUser(text, imgSrc, hadImage) {
    clearHello();
    const m = document.createElement("div"); m.className = "msg user";
    const b = document.createElement("div"); b.className = "bubble";
    if (imgSrc) { const i = new Image(); i.src = imgSrc; i.className = "att"; i.alt = "Фото"; b.appendChild(i); }
    else if (hadImage) { const t = document.createElement("div"); t.className = "photo-tag"; t.textContent = "📷 фото"; b.appendChild(t); }
    if (text) b.appendChild(document.createTextNode(text));
    m.appendChild(b); feed.appendChild(m); scrollDown(true);
  }
  function addAI(text) {
    clearHello();
    const m = document.createElement("div"); m.className = "msg ai";
    const b = document.createElement("div"); b.className = "bubble";
    m.appendChild(b);
    const tools = document.createElement("div"); tools.className = "tools";
    const c = document.createElement("button"); c.textContent = "Копировать";
    c.onclick = () => copy(m.dataset.raw || "", c);
    tools.appendChild(c); m.appendChild(tools);
    if (text != null) { m.dataset.raw = text; renderMarkdown(b, text); }
    else { tools.hidden = true; b.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; }
    feed.appendChild(m); scrollDown(true);
    return { m, b, tools };
  }
  function addPill(text, cls) {
    const p = document.createElement("div"); p.className = cls; p.textContent = text;
    feed.appendChild(p); scrollDown(true); return p;
  }
  function clearHello() { const h = feed.querySelector(".hello"); if (h) h.remove(); }
  function showHello() {
    feed.innerHTML = "";
    const h = document.createElement("div"); h.className = "hello";
    h.innerHTML = `<div class="avatar">${escapeHtml(initial(state.assistant))}</div>
      <h1>Привет${state.name ? ", " + escapeHtml(state.name) : ""}! 💫</h1>
      <p>Я ${escapeHtml(state.assistant)}. Спроси что угодно, пришли фото или выбери идею:</p>
      <div class="chips"></div>`;
    const chips = h.querySelector(".chips");
    IDEAS.forEach((idea) => {
      const c = document.createElement("button"); c.className = "chip"; c.textContent = idea;
      c.onclick = () => { haptic("tap"); input.value = idea.replace(/^\S+\s/, ""); autosize(); input.focus(); updateSend(); };
      chips.appendChild(c);
    });
    feed.appendChild(h);
  }
  const initial = (s) => (s || "✨").trim().charAt(0).toUpperCase() || "✨";
  function setBusy(b, label) {
    state.busy = b;
    const sub = $("sub");
    sub.textContent = b ? (label || "печатает…") : "на связи";
    sub.classList.toggle("busy", b);
    updateSend();
  }
  function updateSend() { btnSend.disabled = state.busy || (!input.value.trim() && !state.image); }

  // ---------- API ----------
  async function loadState() {
    let res;
    try { res = await fetch("api/state", { headers: authHeaders() }); }
    catch (_) { return fatal("Нет связи с сервером. Проверь интернет и открой приложение снова."); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return fatal(data.error || "Ошибка " + res.status);
    state.name = data.user_name || ""; state.assistant = data.assistant_name || "Ассистент"; state.budget = data.budget;
    $("title").textContent = state.assistant; $("avatar").textContent = initial(state.assistant);
    document.title = state.assistant;
    if (!data.history || !data.history.length) showHello();
    else {
      feed.innerHTML = "";
      data.history.forEach((m) => (m.role === "user" ? addUser(m.text, null, m.image) : addAI(m.text)));
      scrollDown(true);
    }
    state.started = true;
  }
  function fatal(text) {
    feed.innerHTML = ""; const n = document.createElement("div"); n.className = "notice"; n.textContent = text;
    feed.appendChild(n); input.disabled = true; btnSend.disabled = true; $("btnAttach").disabled = true;
  }

  async function send() {
    const text = input.value.trim();
    if (state.busy || (!text && !state.image)) return;
    haptic("tap");
    const image = state.image;
    addUser(text, image ? image.url : null, false);
    input.value = ""; autosize(); clearImage();
    setBusy(true);

    const ai = addAI(null);
    let raw = "", pill = null, frame = 0, finished = false;
    const paint = () => {
      frame = 0;
      if (finished) return;
      renderMarkdown(ai.b, raw); ai.b.classList.add("cursor"); scrollDown();
    };
    const stopPaint = () => { finished = true; if (frame) cancelAnimationFrame(frame); frame = 0; };
    try {
      const res = await fetch("api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({ text, image: image ? { media_type: image.type, data: image.data } : null }),
      });
      if (!res.ok || !res.body) {
        const j = await res.json().catch(() => ({}));
        throw new Error(j.error || "Ошибка " + res.status);
      }
      const reader = res.body.getReader(); const dec = new TextDecoder();
      let buf = "";
      while (!finished) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, i); buf = buf.slice(i + 1);
          if (!line.trim()) continue;
          const ev = JSON.parse(line);
          if (ev.type === "delta") {
            if (pill) { pill.remove(); pill = null; setBusy(true); }
            raw += ev.text;
            if (!frame) frame = requestAnimationFrame(paint);
          } else if (ev.type === "status") {
            setBusy(true, ev.text.replace(/^\S+\s/, "").toLowerCase());
            if (!pill) pill = addPill(ev.text, "status-pill"); else pill.textContent = ev.text;
            feed.appendChild(ai.m); if (pill) feed.insertBefore(pill, ai.m);
          } else if (ev.type === "done") {
            stopPaint();
            if (pill) { pill.remove(); pill = null; }
            if (ev.refused) { ai.m.remove(); addPill("Извини, с этим я помочь не могу 🙏", "error-pill"); haptic("warning"); }
            else {
              raw = ev.text || raw; ai.m.dataset.raw = raw;
              renderMarkdown(ai.b, raw); ai.b.classList.remove("cursor"); ai.tools.hidden = false;
              haptic("success");
            }
            if (ev.budget) state.budget = ev.budget;
          } else if (ev.type === "error") {
            throw new Error(ev.text);
          }
        }
      }
      if (!finished) throw new Error("Соединение прервалось. Ответ сохранится — открой приложение заново.");
    } catch (e) {
      stopPaint();
      if (pill) pill.remove();
      if (!raw) ai.m.remove(); else { ai.b.classList.remove("cursor"); renderMarkdown(ai.b, raw); }
      addPill("⚠️ " + (e.message || "Ошибка"), "error-pill");
      haptic("error");
    } finally {
      setBusy(false); scrollDown();
    }
  }

  async function resetChat() {
    if (state.busy) return;
    const go = async () => {
      const res = await fetch("api/reset", { method: "POST", headers: authHeaders() }).catch(() => null);
      if (res && res.ok) { haptic("success"); showHello(); }
      else addPill("⚠️ Не получилось очистить диалог", "error-pill");
    };
    if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) {
      tg.showConfirm("Начать новый диалог? Текущая переписка забудется.", (ok) => ok && go());
    } else if (confirm("Начать новый диалог? Текущая переписка забудется.")) go();
  }

  function showUsage() {
    const b = state.budget; if (!b) return;
    const lim = (v) => (v > 0 ? "$" + v.toFixed(2) : "без лимита");
    let msg = `Сегодня: $${b.today.toFixed(3)} из ${lim(b.daily_limit)}\nЗа месяц: $${b.month.toFixed(2)} из ${lim(b.monthly_limit)}`;
    if (b.per_user_daily_limit > 0) msg += `\nТвои сегодня: $${b.user_today.toFixed(3)} из ${lim(b.per_user_daily_limit)}`;
    if (tg && tg.showPopup && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) tg.showPopup({ title: "Расходы", message: msg, buttons: [{ type: "ok" }] });
    else alert(msg);
  }

  // ---------- images ----------
  async function pickImage(file) {
    if (!file || !file.type.startsWith("image/")) return;
    try {
      const url = URL.createObjectURL(file);
      const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = url; });
      const max = 1568, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL("image/jpeg", 0.85);
      state.image = { type: "image/jpeg", data: dataUrl.split(",")[1], url: dataUrl };
      $("previewImg").src = dataUrl; $("preview").hidden = false;
      updateSend(); input.focus();
    } catch (_) {
      addPill("⚠️ Не получилось открыть картинку", "error-pill");
    }
  }
  function clearImage() { state.image = null; $("preview").hidden = true; $("file").value = ""; updateSend(); }

  // ---------- composer ----------
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
  input.addEventListener("input", () => { autosize(); updateSend(); });
  input.addEventListener("keydown", (e) => {
    const desktop = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    if (e.key === "Enter" && !e.shiftKey && desktop) { e.preventDefault(); send(); }
  });
  input.addEventListener("paste", (e) => {
    const f = [...(e.clipboardData && e.clipboardData.files || [])].find((x) => x.type.startsWith("image/"));
    if (f) { e.preventDefault(); pickImage(f); }
  });
  btnSend.onclick = send;
  $("btnAttach").onclick = () => $("file").click();
  $("file").onchange = (e) => pickImage(e.target.files[0]);
  $("previewDel").onclick = clearImage;
  $("btnNew").onclick = resetChat;
  $("btnUsage").onclick = showUsage;

  loadState();
})();
</script>
</body>
